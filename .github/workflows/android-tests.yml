name: Android JVM tests

# Runs on its own rather than inside "Build APK": the suite is the gate for every Kotlin
# change, and coupling it to an APK build meant it only ran when a build was triggered.
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-tests.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-tests.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: checkout sources
        uses: actions/checkout@v3

      - name: use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: 21

      # capacitor.build.gradle is generated by `cap sync` and the Gradle build cannot be
      # configured without it, so the JS half of the project has to be installed even for a
      # Kotlin-only test run.
      - name: install dependencies
        run: npm ci

      - name: copy to Android project
        run: npx cap sync

      - name: run Android JVM unit tests
        run: ./android/gradlew :app:testDebugUnitTest -p android --no-daemon

      # The JUnit XML is the only place a failure's assertion message survives - Gradle
      # truncates the console output - so publish it whenever the step above goes red.
      - name: upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
