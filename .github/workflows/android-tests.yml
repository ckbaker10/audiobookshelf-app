name: Android JVM tests

# Runs on its own rather than inside "Build APK": the suite is the gate for every Kotlin
# change, and coupling it to an APK build meant it only ran when a build was triggered.
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-tests.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-tests.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: checkout sources
        uses: actions/checkout@v3

      - name: use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: 21

      - name: install dependencies
        run: npm ci

      # `cap update`, not `cap sync`. Gradle cannot configure without
      # android/capacitor-cordova-android-plugins/cordova.variables.gradle, which is generated
      # rather than committed. `cap sync` is `cap copy` + `cap update`, and it is the `copy` half
      # that requires ./dist and fails here with "Could not find the web assets directory" - a
      # Kotlin unit test run has no use for the built web assets, so building them with
      # `npm run generate` just to satisfy that check would add minutes for nothing.
      - name: generate Capacitor native config
        run: npx cap update android

      - name: run Android JVM unit tests
        run: ./android/gradlew :app:testDebugUnitTest -p android --no-daemon

      # The JUnit XML is the only place a failure's assertion message survives - Gradle
      # truncates the console output - so publish it whenever the step above goes red.
      - name: upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
